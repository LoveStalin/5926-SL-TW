<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet">

    <title>Class Account Login</title>

    <link rel="stylesheet" href="./class-login.css"> 
    <link rel="stylesheet" href="./theme.css">
</head>

<body>
    <button class="theme-toggle theme-corner" data-theme-toggle type="button" aria-label="Chuyển theme">☾</button>
    <main class="login-box">
        <div class="login-kicker"><span>✦</span> PRIVATE CLASS SYSTEM</div>
        <h1>11A5 Class Account</h1>

        <p>
            Hệ thống tài khoản riêng của tập thể A5 Khóa 68.
        </p>

        <form id="loginForm">
            <label for="email">Email tài khoản</label>
            <input
                id="email"
                type="email"
                placeholder="admin@example.com"
                required
            >

            <label for="password">Mật khẩu</label>
            <input
                id="password"
                type="password"
                placeholder="Nhập mật khẩu"
                required
            >

            <button id="loginButton" type="submit">
                Đăng nhập
            </button>
        </form>

        <p id="status">Chưa đăng nhập.</p>
        <a class="login-back-link" href="./index.html">← Về trang chính A5-K68</a>
    </main>

    <script src="./theme.js"></script>
    <script type="module" src="./class-login.js"> </script>
</body>
</html>
