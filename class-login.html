<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Class Account Login</title>

    <link rel="stylesheet" href="./class-login.css"> 
</head>

<body>
    <main class="login-box">
        <h1>11A5 Class Account</h1>

        <p>
            Hệ thống tài khoản riêng của tập thể A5 Khóa 68.
        </p>

        <form id="loginForm">
            <label for="email">Email tài khoản</label>
            <input
                id="email"
                type="email"
                placeholder="admin@example.com"
                required
            >

            <label for="password">Mật khẩu</label>
            <input
                id="password"
                type="password"
                placeholder="Nhập mật khẩu"
                required
            >

            <button id="loginButton" type="submit">
                Đăng nhập
            </button>
        </form>

        <p id="status">Chưa đăng nhập.</p>
    </main>

    <script type="module" src="./class-login.js"> </script>
</body>
</html>
